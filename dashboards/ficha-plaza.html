<!DOCTYPE html>
<html lang="es" data-oxxo-fixed-scope="plaza" data-oxxo-fixed-region="TABASCO" data-oxxo-fixed-plaza="Plaza Oaxaca">
<head>
  <!-- Ficha de Plaza: vacantes, bajas y aprovechamiento en una lamina
       (js/ficha-plaza.js). Abierta normal usa el candado del sitio como los
       demas dashboards; con ?embed=1 (pestaña Resumen de la app Conoxxo, mismo
       dominio) exige la sesion de Conoxxo de un puesto con permisos. -->
  <script>
    (function () {
      var embed = /[?&]embed=1\b/.test(location.search);
      document.documentElement.classList.toggle('fp-embed', embed);
      if (!embed) {
        try { if (localStorage.getItem('oxxo_site_unlocked') !== '1') document.documentElement.classList.add('oxxo-locked'); } catch (e) {}
        var s = document.createElement('script');
        s.src = '../js/site-lock.js';
        s.defer = true;
        document.head.appendChild(s);
      }
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Ficha de Plaza · Dashboards Ats</title>
  <link rel="icon" type="image/png" href="../assets/favicon.png" />
  <!-- Tipografia de la app Conoxxo, para la vista embebida (pestaña Resumen). -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --rojo: #e30613; --oro: #c9a227; --amarillo: #f6c400; --verde: #1f7a4a; --tinta: #241a17; --tinta2: #6e605b; --linea: #e7e1db; --card: #f4f0ec; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff; color: var(--tinta); font-family: 'Plus Jakarta Sans', 'Barlow', Arial, Helvetica, sans-serif; }
    .fp-barra-acciones { position: sticky; top: 0; z-index: 5; display: flex; gap: 10px; justify-content: flex-end; align-items: center; padding: 10px 16px; background: rgba(255,255,255,.94); border-bottom: 1px solid var(--linea); }
    .fp-barra-acciones span { margin-right: auto; font-size: 13px; color: var(--tinta2); }
    .fp-btn { border: 0; border-radius: 12px; padding: 10px 16px; font: inherit; font-weight: 800; font-size: 14px; cursor: pointer; background: var(--rojo); color: #fff; }
    .fp-btn.sec { background: #fff; color: var(--tinta); border: 1px solid var(--linea); }
    .fp-btn:disabled { opacity: .5; cursor: default; }
    #ficha { max-width: 1940px; margin: 0 auto; padding: 18px 16px 28px; }
    .fp-estado { padding: 60px 20px; text-align: center; color: var(--tinta2); font-size: 15px; }
    .fp-estado b { display: block; color: var(--tinta); font-size: 18px; margin-bottom: 6px; }
    .fp-cab { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; margin-bottom: 18px; position: relative; }
    .fp-pill { text-transform: uppercase; background: var(--rojo); color: #fff; font-weight: 800; letter-spacing: .06em; padding: 10px 22px; border-radius: 12px; box-shadow: 0 6px 14px rgba(227,6,19,.25); }
    .fp-sub { font-weight: 700; letter-spacing: .06em; color: #5e5550; font-size: 14px; }
    .fp-listón { flex: 1; min-width: 120px; height: 18px; border-radius: 9px; background: linear-gradient(90deg, transparent, var(--rojo) 30%, var(--amarillo) 55%, var(--rojo) 80%, transparent); opacity: .85; }
    .fp-kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 18px; }
    .fp-kpi { display: flex; align-items: center; gap: 16px; background: var(--card); border-radius: 24px; padding: 14px 18px; box-shadow: 0 6px 18px rgba(60,40,30,.10); min-height: 112px; }
    .fp-kpi svg { flex: none; }
    .fp-anillo-txt { font-weight: 800; font-size: 22px; fill: var(--tinta); }
    .fp-kpi b { display: block; font-size: 14px; letter-spacing: .04em; }
    .fp-kpi small { display: block; margin-top: 6px; color: #3a302b; font-size: 13.5px; }
    .fp-kpi small i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin: 0 4px 1px 0; }
    .fp-num { font-size: 48px; font-weight: 800; min-width: 72px; text-align: center; }
    .fp-rojo { color: var(--rojo); }
    .fp-verde { color: var(--verde); }
    .fp-oro { color: var(--oro); }
    .fp-cuerpo { display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(280px, 1fr); gap: 18px; }
    .fp-card { background: var(--card); border-radius: 26px; padding: 18px; box-shadow: 0 6px 18px rgba(60,40,30,.10); min-width: 0; }
    .fp-card h2 { margin: 2px 4px 12px; font-size: 21px; }
    .fp-scroll { overflow-x: auto; }
    .fp-tabla { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 860px; }
    .fp-tabla th { font-size: 11.5px; color: var(--tinta2); letter-spacing: .03em; padding: 8px 6px; text-align: center; }
    .fp-tabla thead tr:last-child th { background: var(--linea); }
    .fp-tabla thead tr:last-child th:first-child { border-radius: 10px 0 0 10px; text-align: left; }
    .fp-tabla thead tr:last-child th:last-child { border-radius: 0 10px 10px 0; }
    .fp-grupos th { border-bottom: 2px solid; padding-bottom: 4px; }
    .g-est { color: var(--oro) !important; border-color: var(--oro); }
    .g-vac { color: #f28c18 !important; border-color: #f28c18; }
    .g-baj { color: var(--rojo) !important; border-color: var(--rojo); }
    .fp-grupos th:first-child { border: 0; }
    .fp-tabla td { padding: 7px 6px; border-bottom: 1px solid var(--linea); text-align: center; white-space: nowrap; }
    .fp-tabla td.fp-asesor { text-align: left; }
    .fp-foco { display: inline-block; margin-left: 8px; background: var(--rojo); color: #fff; font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 5px; vertical-align: 2px; }
    .fp-barra { display: inline-block; position: relative; width: 110px; height: 7px; border-radius: 4px; background: #e8e0d8; margin-right: 10px; vertical-align: middle; }
    .fp-barra span { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; }
    .fp-barra em { position: absolute; top: -5px; width: 2px; height: 17px; background: var(--tinta); }
    .fp-mini { display: inline-block; width: 60px; height: 7px; border-radius: 4px; background: #e8e0d8; margin-left: 8px; vertical-align: middle; position: relative; overflow: hidden; }
    .fp-mini span { position: absolute; inset: 0 auto 0 0; background: #2f8a5b; border-radius: 4px; }
    .fp-chip { display: inline-block; min-width: 30px; padding: 4px 8px; border-radius: 8px; font-weight: 800; }
    .fp-chip.verde { background: #d8f0de; color: var(--verde); }
    .fp-chip.amarillo { background: #fff1b8; color: #8a6100; }
    .fp-chip.rosa { background: #ffe0e6; color: #c2002b; }
    .fp-chip.oscuro { background: var(--verde); color: #fff; }
    .fp-chip.oro { background: var(--amarillo); color: var(--tinta); }
    .fp-chip.rojo { background: var(--rojo); color: #fff; }
    .fp-nada { color: #a2948d; }
    .fp-sep td { text-align: left; font-size: 11.5px; font-weight: 800; color: var(--tinta2); border-bottom: 2px solid var(--tinta); }
    .fp-tabla tfoot td { font-weight: 800; background: var(--linea); border: 0; }
    .fp-tabla tfoot td:first-child { border-radius: 10px 0 0 10px; text-align: left; }
    .fp-tabla tfoot td:last-child { border-radius: 0 10px 10px 0; }
    .fp-tabla tfoot small { font-weight: 400; color: var(--tinta2); }
    .fp-plaza { padding: 12px 10px; border-bottom: 1px solid var(--linea); }
    .fp-plaza.propia { background: #fbf8f5; border-radius: 18px; box-shadow: 0 4px 14px rgba(60,40,30,.10); border: 0; }
    .fp-plaza-cab { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .fp-plaza-cab b { font-size: 18px; }
    .fp-plaza.propia .fp-plaza-cab b { color: var(--rojo); }
    .fp-plaza-cab small { margin-left: auto; color: var(--rojo); font-weight: 800; font-size: 11px; }
    .fp-rank { width: 24px; height: 24px; border-radius: 50%; background: #ece6e0; color: var(--tinta2); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; }
    .fp-plaza.propia .fp-rank { background: var(--rojo); color: #fff; }
    .fp-fila { display: grid; grid-template-columns: 76px 1fr 64px; align-items: center; gap: 10px; margin: 5px 0; font-size: 11.5px; font-weight: 800; color: var(--tinta2); }
    .fp-fila b { text-align: right; font-size: 15px; color: var(--tinta); }
    .fp-track { position: relative; height: 8px; border-radius: 4px; background: #e8e0d8; }
    .fp-track span { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: #a59b93; }
    .fp-track span.v { background: #cfc7c0; }
    .fp-plaza.propia .fp-track span { background: var(--rojo); }
    .fp-plaza.propia .fp-track span.v { background: #f28c18; }
    .fp-track em { position: absolute; left: 62.5%; top: -5px; width: 2px; height: 18px; background: var(--tinta); }
    .fp-nota { color: var(--tinta2); font-size: 12px; margin: 14px 4px 0; }
    .fp-lista { display: none; }
    .fp-item { background: #fff; border-radius: 16px; padding: 12px; margin-top: 10px; }
    .fp-item-cab { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .fp-item-cab b { font-size: 15px; }
    .fp-item-cab small { margin-left: auto; color: var(--tinta2); font-size: 12px; }
    .fp-item-aprov { display: flex; align-items: center; gap: 8px; margin: 8px 0 4px; }
    .fp-item-aprov .fp-barra { flex: 1; margin: 0; }
    .fp-item-datos { display: flex; flex-wrap: wrap; gap: 10px 14px; margin-top: 6px; }
    .fp-item-datos > span { display: flex; flex-direction: column; gap: 3px; }
    .fp-item-datos small { font-size: 10.5px; font-weight: 800; color: var(--tinta2); text-transform: uppercase; letter-spacing: .03em; }
    .fp-item-datos > span > b { font-size: 15px; white-space: nowrap; }
    .fp-item-total { background: var(--linea); }
    @media (max-width: 1100px) {
      .fp-kpis { grid-template-columns: repeat(2, 1fr); }
      .fp-cuerpo { grid-template-columns: 1fr; }
    }
    @media (max-width: 560px) {
      .fp-scroll { display: none; }
      .fp-lista { display: block; }
      #ficha { padding: 12px 12px 24px; }
      .fp-kpis { gap: 10px; }
      .fp-kpi { flex-direction: column; align-items: flex-start; gap: 8px; padding: 12px; border-radius: 18px; min-height: 0; }
      .fp-kpi svg { width: 72px; height: 72px; }
      .fp-num { font-size: 36px; min-width: 0; text-align: left; }
      .fp-kpi b { font-size: 12px; }
      .fp-kpi small { font-size: 12px; }
      .fp-card { padding: 14px; border-radius: 20px; }
      .fp-card h2 { font-size: 17px; }
      .fp-sub { font-size: 12px; }
      .fp-listón { display: none; }
    }

    /* ===== Vista para la app Conoxxo (?embed=1): mismo lenguaje visual que la app ===== */
    html.fp-embed body { background: #FBF6F2; font-family: 'Plus Jakarta Sans', Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
    html.fp-embed .fp-barra-acciones { display: none; }
    html.fp-embed #ficha { max-width: 720px; padding: 4px 14px 104px; }
    .ap { --ap-rojo: #E30613; --ap-oro: #F6B800; --ap-oro-t: #8a6100; --ap-verde: #2E9E6B; --ap-tinta: #241A17; --ap-tinta2: #6E605B; --ap-tinta3: #A2948D; --ap-linea: #EFE5DE; --ap-campo: #F5EEE8; display: flex; flex-direction: column; gap: 12px; }
    .ap .verde { color: var(--ap-verde); } .ap .rojo { color: var(--ap-rojo); } .ap .oro { color: var(--ap-oro-t); }
    .ap-hero { border-radius: 24px; padding: 16px 18px 18px; color: #fff; background: linear-gradient(135deg, #C8000F, #E30613 55%, #F2412A); box-shadow: 0 14px 28px rgba(227,6,19,.24); }
    .ap-hero-top { display: flex; justify-content: space-between; font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; opacity: .88; }
    .ap-hero-main { display: flex; align-items: center; gap: 16px; margin-top: 10px; }
    .ap-hero-anillo { flex: none; }
    .ap-hero-anillo text { fill: #fff; font-weight: 800; font-size: 22px; }
    .ap-hero-kicker { margin: 0; font-size: 12.5px; font-weight: 700; opacity: .9; }
    .ap-hero-txt { margin: 4px 0 8px; font-size: 15px; line-height: 1.35; font-weight: 600; }
    .ap-hero-txt b { font-size: 22px; font-weight: 800; }
    .ap-hero-chips { margin: 0; display: flex; flex-wrap: wrap; gap: 6px; }
    .ap-hero-chips span { background: rgba(255,255,255,.2); border-radius: 999px; padding: 4px 10px; font-size: 11.5px; font-weight: 700; }
    .ap-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .ap-tile { background: #fff; border: 1px solid var(--ap-linea); border-radius: 20px; padding: 13px 14px; box-shadow: 0 8px 18px rgba(70,40,30,.06); min-width: 0; }
    .ap-tile-ancho { grid-column: 1 / -1; }
    .ap-tile small, .ap-det-grid small { display: block; font-size: 11px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--ap-tinta2); }
    .ap-tile b { display: block; font-size: 30px; font-weight: 800; line-height: 1.15; margin-top: 4px; color: var(--ap-tinta); }
    .ap-tile b.rojo { color: var(--ap-rojo); }
    .ap-tile b em { font-style: normal; font-size: 13px; font-weight: 700; color: var(--ap-tinta2); }
    .ap-tile p { margin: 8px 0 0; font-size: 12px; font-weight: 600; color: var(--ap-tinta2); line-height: 1.4; }
    .ap-tile p i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin: 0 4px 0 6px; vertical-align: 0; }
    .ap-tile p i:first-child { margin-left: 0; }
    .ap-tienda { font-weight: 700 !important; color: var(--ap-tinta) !important; }
    .ap-stack { display: flex; height: 8px; border-radius: 6px; overflow: hidden; background: var(--ap-campo); margin-top: 8px; }
    .ap-stack .l, .ap-tile i.l { background: var(--ap-rojo); } .ap-stack .e, .ap-tile i.e { background: #F28C18; } .ap-stack .y, .ap-tile i.y { background: var(--ap-oro); }
    .ap-tile-fila { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .ap-desfase { font-size: 13px; font-weight: 800; border-radius: 999px; padding: 6px 10px; background: #E6F4EC; }
    .ap-desfase.rojo { background: #FFE6E3; }
    .ap-prog { height: 8px; border-radius: 6px; background: var(--ap-campo); margin-top: 10px; overflow: hidden; }
    .ap-prog span { display: block; height: 100%; background: var(--ap-rojo); border-radius: 6px; }
    .ap-card { background: #fff; border: 1px solid var(--ap-linea); border-radius: 22px; padding: 16px; box-shadow: 0 8px 18px rgba(70,40,30,.06); }
    .ap-card h2 { margin: 0; font-size: 17px; font-weight: 800; }
    .ap-sub { margin: 3px 0 10px; font-size: 12.5px; color: var(--ap-tinta2); font-weight: 600; }
    .ap-atencion { border-color: #F7C7C0; background: linear-gradient(180deg, #FFF6F4, #fff 60%); }
    .ap-foco-lista { display: flex; flex-direction: column; gap: 8px; }
    .ap-foco-item, .ap-as-cab { all: unset; box-sizing: border-box; cursor: pointer; display: flex; align-items: center; gap: 12px; width: 100%; }
    .ap-foco-item { background: #fff; border: 1px solid #F7D6D0; border-radius: 16px; padding: 10px 12px; }
    .ap-foco-txt, .ap-as-txt { flex: 1; min-width: 0; }
    .ap-foco-txt b, .ap-as-txt b { display: block; font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ap-foco-txt small, .ap-as-txt small { display: block; font-size: 12px; color: var(--ap-tinta2); font-weight: 600; margin-top: 2px; }
    .ap-ini { flex: none; width: 38px; height: 38px; border-radius: 13px; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; background: var(--ap-campo); color: var(--ap-tinta2); }
    .ap-ini.verde { background: #E6F4EC; color: var(--ap-verde); } .ap-ini.oro { background: #FFF3C8; color: var(--ap-oro-t); } .ap-ini.rojo { background: #FFE6E3; color: var(--ap-rojo); }
    .ap-pct { flex: none; font-size: 13px; font-weight: 800; border-radius: 999px; padding: 5px 9px; background: var(--ap-campo); }
    .ap-pct.verde { background: #E6F4EC; } .ap-pct.oro { background: #FFF3C8; } .ap-pct.rojo { background: #FFE6E3; }
    .ap-foco { font-style: normal; display: inline-block; margin-right: 6px; font-size: 9.5px; font-weight: 800; color: #fff; background: var(--ap-rojo); border-radius: 5px; padding: 2px 5px; vertical-align: 2px; }
    .ap-seg { display: flex; gap: 4px; background: var(--ap-campo); border-radius: 14px; padding: 4px; margin: 12px 0 6px; }
    .ap-seg button { all: unset; box-sizing: border-box; cursor: pointer; flex: 1; text-align: center; font-size: 12.5px; font-weight: 700; color: var(--ap-tinta2); padding: 8px 4px; border-radius: 10px; }
    .ap-seg button[aria-selected="true"] { background: #fff; color: var(--ap-tinta); box-shadow: 0 2px 8px rgba(70,40,30,.10); }
    .ap-lista { list-style: none; margin: 0; padding: 0; }
    .ap-as { border-bottom: 1px solid var(--ap-linea); }
    .ap-as:last-child { border-bottom: 0; }
    .ap-as-cab { padding: 11px 0; }
    .ap-chev { flex: none; color: var(--ap-tinta3); transition: transform .2s; }
    .ap-as.abierto .ap-chev { transform: rotate(90deg); }
    .ap-as-det { padding: 2px 0 14px 50px; }
    .ap-barra { position: relative; height: 8px; border-radius: 6px; background: var(--ap-campo); }
    .ap-barra span { position: absolute; inset: 0 auto 0 0; border-radius: 6px; background: var(--ap-tinta3); }
    .ap-barra span.verde { background: var(--ap-verde); } .ap-barra span.oro { background: var(--ap-oro); } .ap-barra span.rojo { background: var(--ap-rojo); }
    .ap-barra em { position: absolute; left: 92.5%; top: -4px; width: 2px; height: 16px; background: var(--ap-tinta); border-radius: 1px; }
    .ap-det-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 8px; margin-top: 12px; }
    .ap-det-grid b { display: block; font-size: 16px; font-weight: 800; margin-top: 2px; }
    .ap-rangos { display: flex !important; gap: 4px; }
    .ap-rangos i, .ap-leyenda i { font-style: normal; display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; border-radius: 7px; font-size: 12px; }
    .ap-rangos i.v, .ap-leyenda i.v { background: #DFF2E6; color: var(--ap-verde); } .ap-rangos i.a, .ap-leyenda i.a { background: #FFF3C8; color: var(--ap-oro-t); } .ap-rangos i.r, .ap-leyenda i.r { background: #FFE6E3; color: var(--ap-rojo); }
    .ap-leyenda { margin: 10px 0 0; font-size: 11px; color: var(--ap-tinta3); font-weight: 600; }
    .ap-leyenda i { min-width: 10px; width: 10px; height: 10px; border-radius: 3px; margin: 0 3px 0 8px; vertical-align: -1px; }
    .ap-leyenda i:first-child { margin-left: 0; }
    .ap-mas { all: unset; box-sizing: border-box; cursor: pointer; display: block; width: 100%; text-align: center; margin-top: 8px; padding: 11px; border-radius: 14px; background: var(--ap-campo); font-size: 13px; font-weight: 800; color: var(--ap-rojo); }
    .ap-plazas { list-style: none; margin: 4px 0 0; padding: 0; }
    .ap-plazas li { display: grid; grid-template-columns: 26px 96px 1fr 62px; align-items: center; gap: 8px; padding: 9px 6px; border-radius: 12px; }
    .ap-plazas li.propia { background: #FFF1EE; }
    .ap-plazas li b { text-align: right; font-size: 14px; font-weight: 800; }
    .ap-plazas li.propia b, .ap-plazas li.propia .ap-pl-nom { color: var(--ap-rojo); }
    .ap-rank { width: 24px; height: 24px; border-radius: 50%; background: var(--ap-campo); display: inline-flex; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 800; color: var(--ap-tinta2); }
    .ap-plazas li.propia .ap-rank { background: var(--ap-rojo); color: #fff; }
    .ap-pl-nom { font-size: 13.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ap-pl-barra { height: 8px; border-radius: 6px; background: var(--ap-campo); overflow: hidden; }
    .ap-pl-barra span { display: block; height: 100%; border-radius: 6px; background: #CFC4BB; }
    .ap-plazas li.propia .ap-pl-barra span { background: var(--ap-rojo); }
    .ap-nota-chica { margin: 8px 6px 0; font-size: 11.5px; color: var(--ap-tinta3); font-weight: 600; }
    .ap-pie { margin: 2px 6px 0; font-size: 11.5px; line-height: 1.5; color: var(--ap-tinta3); font-weight: 600; }
    .ap-acciones { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 10; display: none; align-items: center; gap: 10px; }
    html.fp-embed .ap-acciones.listo { display: inline-flex; }
    .ap-fab { display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 999px; padding: 14px 22px; background: var(--rojo); color: #fff; font: 800 14.5px 'Plus Jakarta Sans', Arial, sans-serif; box-shadow: 0 12px 26px rgba(227,6,19,.35); cursor: pointer; white-space: nowrap; }
    .ap-fab-desc { display: inline-flex; align-items: center; justify-content: center; width: 50px; height: 50px; border: 1px solid #EADFD8; border-radius: 50%; background: #fff; color: var(--rojo); box-shadow: 0 10px 22px rgba(60,20,10,.16); cursor: pointer; }
    .ap-fab:disabled, .ap-fab-desc:disabled { opacity: .6; }
    .ap-aviso { position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 11; padding: 9px 16px; border-radius: 999px; background: #1F1A17; color: #fff; font: 700 13px 'Plus Jakarta Sans', Arial, sans-serif; opacity: 0; pointer-events: none; transition: opacity .2s; white-space: nowrap; }
    .ap-aviso.ver { opacity: 1; }
    .ap-esq { display: flex; flex-direction: column; gap: 12px; }
    .ap-esq div { border-radius: 22px; background: linear-gradient(90deg, #F1E8E1 25%, #F8F2ED 50%, #F1E8E1 75%); background-size: 200% 100%; animation: ap-brillo 1.2s infinite linear; }
    @keyframes ap-brillo { from { background-position: 200% 0; } to { background-position: 0 0; } }
    html.fp-embed .fp-estado { background: #fff; border: 1px solid #EFE5DE; border-radius: 22px; margin-top: 12px; padding: 40px 22px; font-family: 'Plus Jakarta Sans', Arial, sans-serif; }
  </style>
</head>
<body>
  <div class="fp-barra-acciones">
    <span id="fp-actualizada">Cargando…</span>
    <button type="button" class="fp-btn sec" id="fp-descargar" disabled>Descargar</button>
    <button type="button" class="fp-btn" id="fp-compartir" disabled>Compartir imagen</button>
  </div>
  <main id="ficha"><div class="fp-estado"><b>Armando la ficha…</b>Leyendo vacantes, bajas y aprovechamiento.</div></main>
  <div class="ap-acciones" id="ap-acciones">
    <button type="button" class="ap-fab" id="ap-compartir" aria-label="Compartir la ficha como imagen">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Compartir ficha
    </button>
    <button type="button" class="ap-fab-desc" id="ap-descargar" aria-label="Descargar la ficha como imagen" title="Descargar imagen">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
  <div class="ap-aviso" id="ap-aviso" role="status" aria-live="polite"></div>

  <script src="../js/config.js?v=128d5ab7"></script>
  <script src="../js/core.js?v=128d5ab7"></script>
  <script src="../js/admin-pptx-rae.js?v=128d5ab7"></script>
  <script src="../js/ficha-plaza.js?v=128d5ab7"></script>
  <script>
    (function () {
      var EMBED = document.documentElement.classList.contains('fp-embed');
      // Supabase de Conoxxo (llave publica, la misma de la app y del Apps Script).
      var SUPABASE_URL = 'https://gceuazxrqdbfahtdieod.supabase.co';
      var SUPABASE_KEY = 'sb_publishable_59I8XugqRxE-LUhMSqmiEQ_HNzD7CRK';
      var ficha = null;
      var $ = function (id) { return document.getElementById(id); };
      function estado(titulo, texto) { $('ficha').innerHTML = '<div class="fp-estado"><b>' + titulo + '</b>' + texto + '</div>'; $('fp-actualizada').textContent = ''; }

      // Dentro de la app: la app guarda su llave de sesion en este mismo
      // dominio (localStorage 'oxxito:sessionKey'); solo puestos con permisos.
      async function sesionConoxxo() {
        var llave = '';
        try { llave = JSON.parse(localStorage.getItem('oxxito:sessionKey') || 'null') || ''; } catch (e) {}
        if (!/^[0-9a-f]{64}$/.test(llave)) return 'sin';
        var r = await fetch(SUPABASE_URL + '/rest/v1/rpc/sesion_validar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY },
          body: JSON.stringify({ p_token: llave }),
        });
        var d = await r.json().catch(function () { return null; });
        if (!d || d.estado !== 'ok') return 'sin';
        return d.permisos ? 'ok' : 'puesto';
      }

      async function iniciar() {
        // En la app: esqueleto con la forma de la vista mientras se calcula.
        if (EMBED) $('ficha').innerHTML = '<div class="ap-esq" aria-label="Cargando la ficha"><div style="height:164px"></div><div style="height:118px"></div><div style="height:104px"></div><div style="height:230px"></div><div style="height:420px"></div></div>';
        if (EMBED) {
          var s = await sesionConoxxo().catch(function () { return 'error'; });
          if (s === 'sin') return estado('Confirma tu sesión', 'Cierra esta pestaña de la app y vuelve a abrirla; si sigue, confirma tu PIN en Contratos colectivos.');
          if (s === 'puesto') return estado('Sin acceso', 'Tu puesto no tiene acceso a la ficha de la plaza.');
          if (s === 'error') return estado('Sin conexión', 'No pudimos verificar tu sesión. Revisa tu conexión e intenta de nuevo.');
        }
        try {
          ficha = await window.OXXO_FICHA.calcular();
        } catch (e) {
          return estado('No se pudo armar la ficha', String(e && e.message || e));
        }
        if (EMBED) {
          window.OXXO_FICHA.renderApp($('ficha'), ficha);
          $('ap-acciones').classList.add('listo');
        } else window.OXXO_FICHA.render($('ficha'), ficha);
        $('fp-actualizada').textContent = 'Generada ' + ficha.generada.toLocaleString('es-MX', { dateStyle: 'medium', timeStyle: 'short' });
        $('fp-descargar').disabled = false;
        $('fp-compartir').disabled = false;
      }

      $('ap-compartir').addEventListener('click', async function () {
        if (!ficha) return;
        this.disabled = true;
        try { await window.OXXO_FICHA.compartir(ficha); } finally { this.disabled = false; }
      });
      var avisoTimer = null;
      function aviso(texto) {
        var el = $('ap-aviso');
        el.textContent = texto;
        el.classList.add('ver');
        clearTimeout(avisoTimer);
        avisoTimer = setTimeout(function () { el.classList.remove('ver'); }, 2600);
      }
      $('ap-descargar').addEventListener('click', async function () {
        if (!ficha) return;
        this.disabled = true;
        try {
          await window.OXXO_FICHA.descargar(ficha);
          aviso('Imagen descargada');
        } catch (e) {
          aviso('No se pudo descargar');
        } finally { this.disabled = false; }
      });
      $('fp-descargar').addEventListener('click', function () { if (ficha) window.OXXO_FICHA.descargar(ficha); });
      $('fp-compartir').addEventListener('click', async function () {
        if (!ficha) return;
        this.disabled = true;
        try { await window.OXXO_FICHA.compartir(ficha); } finally { this.disabled = false; }
      });
      iniciar();
    })();
  </script>
</body>
</html>
